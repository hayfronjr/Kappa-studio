<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#116b52"/>
      <stop offset="100%" stop-color="#0a4635"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#05241b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with squircle radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Clipboard Body -->
  <g filter="url(#shadow)">
    <rect x="116" y="110" width="280" height="340" rx="24" fill="#ffffff"/>
    <!-- Clipboard clip top -->
    <rect x="186" y="80" width="140" height="56" rx="14" fill="#e3f3ec" stroke="#116b52" stroke-width="8"/>
    <circle cx="256" cy="108" r="12" fill="#116b52"/>
    
    <!-- Attendance row 1 with check -->
    <circle cx="166" cy="180" r="18" fill="#e3f3ec"/>
    <path d="M156 180 L163 187 L176 173" fill="none" stroke="#116b52" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="200" y="172" width="160" height="16" rx="8" fill="#116b52" opacity="0.9"/>
    
    <!-- Attendance row 2 with check -->
    <circle cx="166" cy="240" r="18" fill="#e3f3ec"/>
    <path d="M156 240 L163 247 L176 233" fill="none" stroke="#116b52" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="200" y="232" width="130" height="16" rx="8" fill="#116b52" opacity="0.9"/>
    
    <!-- Attendance row 3 with check -->
    <circle cx="166" cy="300" r="18" fill="#e3f3ec"/>
    <path d="M156 300 L163 307 L176 293" fill="none" stroke="#116b52" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="200" y="292" width="145" height="16" rx="8" fill="#116b52" opacity="0.9"/>

    <!-- Attendance row 4 with check -->
    <circle cx="166" cy="360" r="18" fill="#e3f3ec"/>
    <path d="M156 360 L163 367 L176 353" fill="none" stroke="#116b52" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="200" y="352" width="115" height="16" rx="8" fill="#116b52" opacity="0.9"/>
  </g>
  
  <!-- Modern checkmark floating chip -->
  <g transform="translate(320, 360)">
    <circle cx="48" cy="48" r="44" fill="#3fbf95" stroke="#ffffff" stroke-width="8"/>
    <path d="M34 49 L44 59 L62 39" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
