  if(y>282){d.addPage();y=th(14)}
  const on=s.marks[m.id];
  if(on){d.setFillColor(227,243,236);d.rect(L,y,W,6.4,'F')}else if(k%2){d.setFillColor(246,245,240);d.rect(L,y,W,6.4,'F')}
  d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(30);
  d.text(String(k+1),X[0]+1.5,y+4.4);d.text(cut(m.name,56),X[1]+1.5,y+4.4);d.setTextColor(90);
  d.text(cut(m.unit,38),X[2]+1.5,y+4.4);d.text(cut(m.phone,44),X[3]+1.5,y+4.4);
  if(on){d.setTextColor(17,107,82);d.text(cut(fmt(on,'en-GB'),40),X[4]+1.5,y+4.4)}else{d.setTextColor(150);d.text('Absent',X[4]+1.5,y+4.4)}
  y+=6.4});
 const np=d.getNumberOfPages();
 for(let p=1;p<=np;p++){d.setPage(p);d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(120);d.text('Page '+p+' of '+np,105,291,{align:'center'})}
 const name=(s.title.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'register')+'.pdf';
 try{await dl.save({filename:name,data:d.output('arraybuffer')});toast('PDF saved')}catch(e){if(!e||e.code!=='declined')toast('Could not save the PDF')}
}

document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,i=t.dataset.i;
 if(a==='ask'){ui.cf=t.dataset.k;render();return}
 ui.cf=null;
 if(a==='home')go('home');
 else if(a==='roll')go('roll',i);
 else if(a==='sess')go('sess',i);
 else if(a==='newroll'){const r={id:uid(),name:'New roll',members:[]};S.rolls.push(r);save();go('roll',r.id)}
 else if(a==='start'){const r=roll(i),now=new Date().toISOString();const s={id:uid(),rollId:r.id,rollName:r.name,title:r.name+' – '+fday(now),start:now,end:null,status:'open',members:r.members.map(m=>({...m})),marks:{}};S.sessions.push(s);save();go('sess',s.id)}
 else if(a==='pdf')makePdf(sess(i));
 else if(a==='delsess'){S.sessions=S.sessions.filter(s=>s.id!==i);save();render()}
 else if(a==='filt'){ui.f=t.dataset.f;render()}
 else if(a==='finish'){const s=sess(ui.id);s.status='closed';s.end=new Date().toISOString();save();await makePdf(s);go('home')}
 else if(a==='reopen'){const s=sess(ui.id);s.status='open';s.end=null;save();render()}
 else if(a==='delroll'){S.rolls=S.rolls.filter(r=>r.id!==i);save();go('home')}
 else if(a==='addm'){const r=roll(ui.id),n=$('#nn').value.trim();if(!n){toast('Enter a name');return}
  r.members.push({id:uid(),name:n,unit:$('#nu').value.trim(),phone:$('#np').value.trim(),tag:$('#nt').value.trim()});save();render();toast('Added')}
 else if(a==='bulk'){const r=roll(ui.id);let c=0;$('#bulk').value.split('\n').forEach(l=>{const f=l.split(/,|\t/).map(x=>x.trim());if(f[0]){r.members.push({id:uid(),name:f[0],unit:f[1]||'',phone:f[2]||'',tag:''});c++}});save();render();toast(c+' added')}
 else if(a==='editm'){ui.edit=i;renderMembers()}
 else if(a==='cancelm'){ui.edit=null;renderMembers()}
 else if(a==='savem'){const m=roll(ui.id).members.find(x=>x.id===i);m.name=$('#en').value.trim()||m.name;m.unit=$('#eu').value.trim();m.phone=$('#ep').value.trim();m.tag=$('#et').value.trim();ui.edit=null;save();renderMembers()}
 else if(a==='delm'){const r=roll(ui.id);r.members=r.members.filter(m=>m.id!==i);save();render()}
 else if(a==='export'){let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(x){}
  if(!dl){toast('Download isn’t available in this view.');return}
  try{await dl.save({filename:'rollcall-backup-'+new Date().toISOString().slice(0,10)+'.json',data:JSON.stringify(S)});toast('Backup saved')}catch(x){if(!x||x.code!=='declined')toast('Could not save backup')}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-q]')){ui.q=t.value;ui.v==='sess'?renderList():renderMembers()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.m){const s=sess(ui.id);if(t.checked)s.marks[t.dataset.m]=new Date().toISOString();else delete s.marks[t.dataset.m];save();renderList()}
 else if(t.matches('[data-title]')){sess(ui.id).title=t.value.trim()||'Register';save()}
 else if(t.matches('[data-rname]')){roll(ui.id).name=t.value.trim()||'Untitled roll';save()}
 else if(t.matches('[data-restore]')){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);let a=0;(j.rolls||[]).forEach(r=>{if(!roll(r.id)){S.rolls.push(r);a++}});(j.sessions||[]).forEach(s=>{if(!sess(s.id)){S.sessions.push(s);a++}});save();render();toast(a+' items restored')}catch(x){toast('That file isn’t a valid backup')}};rd.readAsText(f)}
});
render();
</script></body></html>
